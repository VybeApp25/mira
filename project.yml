name: Mira
options:
  bundleIdPrefix: com.trevonbarbour
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"

targets:
  Mira:
    type: application
    platform: macOS
    sources:
      - path: Mira
        excludes:
          - "Resources/Skills"
          - "Resources/Skills/**"
      # Prompt-skill bundles ship as a folder reference so the per-skill
      # subfolder tree (Skills/<id>/SKILL.md) is preserved in the app bundle
      # at Contents/Resources/Skills, where MiraSkillLoader expects it. Added
      # as a folder (not individual files) because every skill's file is named
      # SKILL.md and would otherwise collide when Copy-Bundle-Resources flattens.
      - path: Mira/Resources/Skills
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: IOKit.framework
      - sdk: Carbon.framework
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Mira/Mira.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.automation.apple-events: true
        # Required for Sparkle to download updates
        com.apple.security.network.client: true
    info:
      path: Mira/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: Mira
        CFBundleName: Mira
        CFBundleVersion: "5"
        CFBundleShortVersionString: "1.0.2"
        NSMicrophoneUsageDescription: "Mira listens for voice commands."
        NSSpeechRecognitionUsageDescription: "Mira transcribes your voice to text."
        NSScreenCaptureUsageDescription: "Mira sees your screen to show you exactly where to click."
        NSCalendarsUsageDescription: "Mira shows your upcoming events in the Home tab."
        NSAppleEventsUsageDescription: "Mira reads your active browser tab to provide context-aware assistance."
        NSLocationWhenInUseUsageDescription: "Mira uses your location to show local weather on the Home tab."
        NSLocationUsageDescription: "Mira uses your location to show local weather on the Home tab."
        # Sparkle update feed — hosted on Supabase Storage (public, repo-privacy-agnostic)
        SUFeedURL: "https://rdbljrbjsmbfqwwpwwvn.supabase.co/storage/v1/object/public/releases/appcast.xml"
        # Generated by: ./Sparkle/bin/generate_keys — paste public key here
        SUPublicEDKey: "2iBo+zLdYngL6mFsqVQCgTsWpJMjBULTaB5TtTsC/Bs="
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        # Custom URL scheme for the Apple web-OAuth callback (mira://auth-callback)
        CFBundleURLTypes:
          - CFBundleURLName: com.trevonbarbour.mira
            CFBundleURLSchemes: [mira]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trevonbarbour.mira
        PRODUCT_NAME: Mira
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Xcode 16 splits Debug builds into a thin launcher + Mira.debug.dylib,
          # which is signed only for launch-by-Xcode. Running such a build
          # standalone (double-clicked from /Applications) aborts at launch:
          # "Library not loaded: @rpath/Mira.debug.dylib … different Team IDs".
          # Disabling it links Debug statically (like Release) so standalone runs
          # work. Worth the slightly slower incremental builds.
          ENABLE_DEBUG_DYLIB: NO
          # Sign Debug builds with the local self-signed "Mira Dev" identity so
          # the code-signing requirement stays STABLE across rebuilds. Ad-hoc
          # signing produces a new CDHash every build, which makes TCC treat each
          # build as a new app and re-prompt for Screen Recording / System Audio.
          # A stable identity lets TCC bind the grant once and keep it.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Mira Dev"
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGNING_ALLOWED: YES
          DEVELOPMENT_TEAM: "7FD7W8SX34"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGNING_REQUIRED: YES
          DEVELOPMENT_TEAM: "7FD7W8SX34"
          # Prevent Xcode from injecting get-task-allow (debug-only entitlement
          # that Apple's notarization service rejects in distribution builds).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime"
